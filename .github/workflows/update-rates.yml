name: تحديث مؤشرات الشحن

# كل جمعة 13:00 بتوقيت عُمان (09:00 UTC) — بعد نشر WCI يوم الخميس وSCFI يوم الجمعة.
# ويمكن تشغيله يدويًا من تبويب Actions في أي وقت.
on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write

# تشغيل واحد فقط في كل مرة — يمنع تسابق تشغيلين على الدفع
concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: جلب المؤشرات وتحديث rates.json
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: node scripts/update-rates.mjs

      - name: التأكد أن الموقع ما زال يُبنى
        run: |
          npm ci
          npm run build

      - name: حفظ التغيير ودفعه
        run: |
          if [ -z "$(git status --porcelain src/_data/rates.json)" ]; then
            echo "لا تغيير — لا شيء يُدفع."
            exit 0
          fi
          git config user.name "mamarr-bot"
          git config user.email "actions@github.com"
          git add src/_data/rates.json
          git commit -m "تحديث مؤشرات الشحن — $(date -u +%Y-%m-%d)"

          # إن تحرّك الفرع البعيد أثناء التشغيل، أعد البناء فوقه وحاول مجددًا
          for attempt in 1 2 3; do
            if git push; then
              echo "تم الدفع في المحاولة $attempt."
              exit 0
            fi
            echo "الدفع مرفوض — إعادة المزامنة ثم المحاولة ($attempt)."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "تعذّر الدفع بعد ثلاث محاولات."
          exit 1
